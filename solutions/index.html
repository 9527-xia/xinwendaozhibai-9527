<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="闻道知白医疗解决方案 - 智慧手术室、医院净化、信息科整体解决方案">
  <title>解决方案 - 闻道知白</title>
  <link rel="stylesheet" href="../css/style.css">

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- 导航栏 -->
  <header class="header" id="main-header"></header>
  <script src="../js/nav-component.js"></script>

  <!-- 3D旋转木马 Banner -->
  <section class="solutions-banner">
    <div class="carousel-3d" id="carousel3d"></div>
  </section>

  <!-- 分类标签 -->
  <div class="category-tabs">
    <div class="category-tab active" data-category="smart">医院智能化医疗专项</div>
    <div class="category-tab" data-category="purify">医院净化（手术部/ICU）</div>
    <div class="category-tab" data-category="info">医院信息化</div>
  </div>

  <!-- 概述区域 -->
  <section class="overview-section" id="overview">
    <div class="container">
      <div class="overview-grid">
        <div class="overview-content">
          <div class="subtitle" id="category-subtitle">SMART OPERATING ROOM</div>

          <p id="category-desc">以数字化手术室为核心，整合手术示教、ICU探视、远程会诊等系统，打造智慧医院手术部整体解决方案</p>
          <div class="feature-list" id="feature-list">
            <!-- 动态生成 -->
          </div>
        </div>
        <div class="overview-image">
          <img loading="lazy" src="../images/solution-overview.jpg" alt="方案概述" id="overview-image">
        </div>
      </div>
    </div>
  </section>

  <!-- 方案卡片 -->
  <section class="solutions-section">
    <div class="container">
      <div class="section-header">
        <h2 id="solutions-title">智慧手术室方案</h2>
        <p id="solutions-subtitle">全面的手术室智能化解决方案</p>
      </div>
      <div class="solutions-grid" id="solutions-grid">
        <!-- 动态生成 -->
      </div>
    </div>
  </section>

  <!-- 相关产品 -->
  <section class="products-section">
    <div class="container">
      <div class="section-header">
        <h2>相关产品</h2>
        <p>为您推荐相关产品</p>
      </div>
      <div class="products-scroll" id="products-scroll">
        <!-- 动态生成 -->
      </div>
    </div>
  </section>

  <div id="main-footer"></div>
<script src="../js/footer-component.js"></script>

  <script src="../js/products-data.js"></script>
  <script src="../js/cases-data.js"></script>
