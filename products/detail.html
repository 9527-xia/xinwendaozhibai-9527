<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="产品详情 - 闻道知白">
  <title>产品详情 - 闻道知白</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/product-detail.css">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>

<!-- 导航栏 -->
<header class="header" id="main-header"></header>
<script src="../js/nav-component.js"></script>

<!-- 分类Banner -->
<section class="category-banner" id="category-banner">
  <img loading="lazy" src="" alt="产品分类" id="category-banner-img">
</section>

<!-- 面包屑 -->
<div class="breadcrumb">
  <div class="breadcrumb-list">
    <a href="../index.html">首页</a>
    <span>/</span>
    <a href="index.html">产品中心</a>
    <span>/</span>
    <a href="index.html" id="breadcrumb-category-link">产品分类</a>
    <span>/</span>
    <span id="breadcrumb-name">产品名称</span>
  </div>
</div>

<!-- 产品导航 - 上一个/下一个 -->
<div class="product-nav" id="product-nav">
  <a href="#" class="product-nav-btn" id="nav-prev" title="上一个产品">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15,18 9,12 15,6"></polyline>
    </svg>
    <span class="product-nav-tooltip" id="prev-name">上一个</span>
  </a>
  <a href="#" class="product-nav-btn" id="nav-next" title="下一个产品">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9,18 15,12 9,6"></polyline>
    </svg>
    <span class="product-nav-tooltip" id="next-name">下一个</span>
  </a>
</div>

<!-- 产品详情 -->
<section class="product-detail" id="product-detail">
  <div class="container">
    <!-- 内容由JS动态生成 -->
  </div>
</section>

<!-- 相关产品 -->
<section class="related-products" id="related-section" style="display: none;">
  <div class="container">
    <h2 class="section-title">相关产品</h2>
    <div class="related-grid" id="related-grid">
      <!-- 由JS动态生成 -->
    </div>
  </div>
</section>

<div id="main-footer"></div>
<script src="../js/footer-component.js"></script>

<script src="../js/products-data.js"></script>
<script src="../js/cases-data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/product-detail-page.js"></script>
</body>
</html>
