<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="闻道知白成功案例展示，已为全国百家医院提供手术示教、ICU探视、数字化手术室等智能化解决方案。">
  <meta property="og:title" content="成功案例 - 闻道知白">
  <meta property="og:description" content="闻道知白成功案例展示，已为全国百家医院提供智能化解决方案。">
  <meta property="og:type" content="website">
  <title>成功案例 - 闻道知白</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cases.css">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="header" id="main-header"></header>
  <script src="../js/nav-component.js"></script>

  <!-- 翻书Banner -->
  <section class="book-banner">
    <!-- 暖黄色光斑 -->



    <!-- 粒子容器 -->
    <div class="particles-container" id="particles"></div>

    <!-- 滚动提示 -->
    <div class="scroll-hint">↓ 向下滚动查看更多</div>

    <div class="book-wrapper">
      <div class="book" id="book">
        <!-- 内页完整图 -->
        <div class="inner-spread" id="innerSpread"></div>
        <!-- 左封面 -->
        <div class="cover-left" id="coverLeft">
          <div class="cover-face front">
            <div class="cover-content">
              <h1 class="cover-title">成功案例</h1>
              <p class="cover-subtitle">赋能医疗 · 智慧未来</p>
              <div class="cover-line"></div>
            </div>
          </div>
          <div class="cover-face back"></div>
        </div>
        <!-- 右封面 -->
        <div class="cover-right" id="coverRight">
          <div class="cover-face front">
            <div class="cover-content">
              <h1 class="cover-title">精选案例</h1>
              <p class="cover-subtitle">专业方案 · 值得信赖</p>
              <div class="cover-line"></div>
            </div>
          </div>
          <div class="cover-face back"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 时间线案例 -->
  <section class="timeline-section">
    <div class="container">
      <div class="section-header">
        <h2>精选案例</h2>
        <p>探索我们在全国各地的成功实践</p>
        <div class="line"></div>
      </div>
      <div class="timeline" id="timeline"></div>
      <div class="timeline-pagination" id="pagination"></div>
    </div>
  </section>

  <!-- 握手结尾 -->
  <section class="ending-section">
    <img loading="lazy" src="../images/cases/ending-1.jpg" alt="合作共赢携手未来">
    <div class="ending-overlay"></div>
    <div class="ending-content">
      <h2>合作共赢 · 携手未来</h2>
      <div class="ending-line"></div>
      <p>以科技赋能医疗，以合作创造价值</p>
      <div class="ending-stats">
        <div class="es-item"><div class="es-num">50+</div><div class="es-label">合作医院</div></div>
        <div class="es-item"><div class="es-num">100+</div><div class="es-label">成功案例</div></div>
        <div class="es-item"><div class="es-num">98%</div><div class="es-label">客户满意度</div></div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="main-footer"></div>
<script src="../js/footer-component.js"></script>

  <script src="../js/products-data.js"></script>
  <script src="../js/cases-data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/cases-page.js"></script>
</body>
</html>
